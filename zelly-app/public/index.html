<!doctype html>
<html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><style>html,body{margin:0}</style>
<title>Zelly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2314b8a6'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Cpath d='M27 25H73L40 48.5H68L27 76H73' fill='none' stroke='%23fff' stroke-width='9' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&family=Playfair+Display:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Noto+Serif+Lao:wght@500;600&family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: sticky top bar (brand + mode switch), scrolling sub-tabs, 1080px work area.
   Storefront renders as a 420px phone column that takes the store's own color. */
:root{
  --bg:#f3f7fc;--surface:#ffffff;--surface-2:#eaf1fb;--line:#d8e4f3;--fg:#0e2441;--muted:#566c87;
  --brand:#2a7de1;--brand-ink:#ffffff;--brand-soft:#e2eeff;
  --ok:#0f7a52;--ok-soft:#d9f3e6;--warn:#9a5b00;--warn-soft:#ffefcf;--bad:#b83232;--bad-soft:#fde3e3;
  --shadow:0 8px 28px rgba(14,36,65,.16);--scrim:rgba(8,22,40,.45);
  --r:14px;
  --f-display:'Prompt','Noto Sans Lao','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'Noto Sans Thai','Noto Sans Lao',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1626;--surface:#11233a;--surface-2:#182e4a;--line:#25405f;--fg:#e7f0fb;--muted:#93a9c6;
  --brand:#5aa4ff;--brand-ink:#06182e;--brand-soft:#17325a;
  --ok:#4fd39b;--ok-soft:#12362b;--warn:#f0b95a;--warn-soft:#3a2c0f;--bad:#ff8d8d;--bad-soft:#3d1b1f;
  --shadow:0 8px 28px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1626;--surface:#11233a;--surface-2:#182e4a;--line:#25405f;--fg:#e7f0fb;--muted:#93a9c6;
  --brand:#5aa4ff;--brand-ink:#06182e;--brand-soft:#17325a;
  --ok:#4fd39b;--ok-soft:#12362b;--warn:#f0b95a;--warn-soft:#3a2c0f;--bad:#ff8d8d;--bad-soft:#3d1b1f;
  --shadow:0 8px 28px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}.num{font-variant-numeric:tabular-nums}
.ico{flex:none;vertical-align:-3px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font:600 18px/1 var(--f-display);margin-right:auto}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
.seg.lang button{padding:6px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(14,36,65,.18)}
.subnav{border-bottom:1px solid var(--line);background:var(--surface)}
.subnav-in{display:flex;gap:4px;overflow-x:auto;max-width:1080px;margin:0 auto;scrollbar-width:none}
.subnav-in::-webkit-scrollbar{display:none}
.tabbtn{display:flex;align-items:center;gap:6px;border:0;background:none;padding:11px 12px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.tabbtn[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.page{max-width:1080px;margin:0 auto;padding-block:20px 56px}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:22px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}.grow{flex:1;min-width:0}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:16px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile{min-width:0}.tile b{display:block;font:600 clamp(19px,1.9vw,24px)/1.2 var(--f-display);margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:10px;font-weight:500;line-height:1.3;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.chip[disabled]{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.info{background:var(--brand-soft);color:var(--brand)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
.field small{font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
textarea{min-height:72px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.switch{position:relative;width:42px;height:24px;border-radius:999px;border:0;background:var(--line);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.err{color:var(--bad);font-size:13px;min-height:0}
.err:empty{display:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}

/* lists + tables */
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
button.li{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit}
button.li:first-child{border-top:0}
.scrollx{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.stk{display:inline-flex;align-items:center;gap:4px}
.stk input{width:64px;text-align:center;padding:4px;min-height:32px}
.avatar{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;font:600 17px var(--f-display);background:var(--brand);color:var(--brand-ink)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.mini{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:var(--r);padding:12px;background:var(--surface-2)}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim)}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);outline:0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet-h h2{font-size:18px}
.sheet-b{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sheet-f .btn{flex:1}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px;max-height:86vh}}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* storefront (phone column) */
.shopbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:420px;margin:0 auto 12px}
.phone{--th:#2a7de1;--th-ink:#fff;--th-soft:color-mix(in srgb,var(--th) 11%,var(--surface));--th-line:color-mix(in srgb,var(--th) 30%,var(--surface));--th-text:color-mix(in srgb,var(--th) 78%,var(--fg));
  max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:clip;box-shadow:var(--shadow);position:relative}
.phone .btn.pri{background:var(--th);border-color:var(--th);color:var(--th-ink)}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px;background:var(--th-soft)}
.sh-head .avatar{background:var(--th);color:var(--th-ink)}
.sh-head h1{font-size:18px}
.sh-body{padding:14px;display:flex;flex-direction:column;gap:14px}
.promos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.promo{scroll-snap-align:start;flex:0 0 82%;border-radius:14px;padding:12px 14px;background:var(--th);color:var(--th-ink);display:flex;flex-direction:column;gap:4px}
.promo b{font:600 16px/1.35 var(--f-display)}
.promo .code{align-self:flex-start;margin-top:4px;border:1px dashed currentColor;background:transparent;color:inherit;border-radius:8px;padding:2px 10px;font-weight:600;letter-spacing:.04em}
.searchbox{position:relative}
.searchbox input{padding-left:36px}
.searchbox .ico{position:absolute;left:11px;top:11px;color:var(--muted)}
.phone .chip[aria-pressed="true"]{background:var(--th-soft);border-color:var(--th);color:var(--th-text)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pgrid.list{grid-template-columns:1fr}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;background:none;padding:0;min-width:0}
.pgrid.list .pcard{flex-direction:row;gap:12px;align-items:center}
.pgrid.list .ptile{width:96px;flex:none}
.ptile{position:relative;aspect-ratio:1/1.1;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.ptile .ico{opacity:.8}
.ptile .tag{position:absolute;left:8px;top:8px}
.pname{font-weight:500;line-height:1.4;font-size:14px}
.pprice{font:600 15px var(--f-display);color:var(--th-text)}
.cartbar{position:sticky;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.qty button{width:34px;height:34px;border:0;background:none;display:grid;place-items:center}
.qty span{min-width:30px;text-align:center;font-weight:600}
.sum{display:flex;justify-content:space-between;gap:10px}
.sum.total{font:600 17px var(--f-display);padding-top:8px;border-top:1px solid var(--line)}
.sheet.shop{--th:#2a7de1;--th-ink:#fff;--th-soft:color-mix(in srgb,var(--th) 11%,var(--surface));--th-text:color-mix(in srgb,var(--th) 78%,var(--fg))}
.sheet.shop .btn.pri{background:var(--th);border-color:var(--th);color:var(--th-ink)}
.sheet.shop .chip[aria-pressed="true"]{background:var(--th-soft);border-color:var(--th);color:var(--th-text)}
.sheet.shop .pprice{color:var(--th-text)}

/* packing */
.pk-items{display:flex;flex-direction:column;gap:2px}
.pick{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2);cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--brand)}
.pick.done{opacity:.6;text-decoration:line-through}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--brand)}

/* sticker (paper preview keeps paper colors in both themes) */
.paper{width:100%;max-width:320px;margin:0 auto;aspect-ratio:2/3;background:#fff;color:#111;border:2px solid #111;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:12px;line-height:1.45}
.paper h3{font:700 11px var(--f-body);letter-spacing:.08em;color:#444}
.paper .to{font-size:16px;font-weight:700;line-height:1.35}
.paper hr{border:0;border-top:1.5px dashed #111;margin:0}
.paper .foot{margin-top:auto;display:flex;gap:10px;align-items:flex-end;justify-content:space-between}
.paper .oid{font:700 22px var(--f-display)}
.qr{display:block;width:84px;height:84px;image-rendering:pixelated}
.qr.big{width:200px;height:200px;margin:0 auto;border-radius:10px;border:1px solid var(--line)}
.linkbox{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;background:var(--surface-2);min-width:0}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---- landing, plans, banners, super admin ---- */
.btn.lg{padding:12px 20px;min-height:48px;font-size:16px;border-radius:12px}
.lp-nav{display:none;gap:2px}
.lp-nav button{border:0;background:none;padding:6px 10px;color:var(--muted);font-weight:500;border-radius:8px}
.lp-nav button:hover{color:var(--brand);background:var(--surface-2)}
@media (min-width:860px){.lp-nav{display:flex}}
.lp-hero{background:linear-gradient(180deg,var(--brand-soft),var(--bg))}
.lp-hero-in{display:grid;gap:32px;max-width:1080px;margin:0 auto;padding-block:36px 44px;align-items:center}
@media (min-width:860px){.lp-hero-in{grid-template-columns:1.1fr .9fr;padding-block:64px 72px}}
.lp-copy{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.lp-copy h1{font-size:clamp(28px,5.4vw,44px);line-height:1.2}
.lp-sub{font-size:17px;color:var(--muted);max-width:52ch}
.lp-visual{position:relative;padding:0 0 28px}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);max-width:360px;margin:0 auto}
.mock-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mock-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mock-grid .ptile{height:96px;border-radius:12px;display:grid;place-items:center}
.mock-qr{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);width:max-content;max-width:92%;margin:-22px auto 0 auto;position:relative}
@media (min-width:860px){.mock-qr{margin:-30px 0 0 8%;}}
.mock-qr .qr{width:64px;height:64px}
.lp-sec{padding-block:44px}
.lp-band{background:var(--surface);border-block:1px solid var(--line)}
.lp-wrap{max-width:1080px;margin:0 auto}
.lp-title{text-align:center;margin-bottom:26px;display:flex;flex-direction:column;gap:6px;align-items:center}
.lp-title h2{font-size:clamp(22px,3.6vw,30px)}
.lp-title p{max-width:56ch}
.lp-feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lp-feat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.lp-feat h3{font-size:16px}
.lp-ico{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand)}
.lp-why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.lp-why>div{display:flex;flex-direction:column;gap:6px}
.lp-why .ico{color:var(--brand)}
.lp-why h3{font-size:17px}
.lp-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.lp-steps li{display:flex;gap:12px;align-items:flex-start}
.lp-steps h3{font-size:16px}
.lp-n{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:600 16px var(--f-display)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:stretch}
.plan{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 18px;display:flex;flex-direction:column;gap:10px}
.plan.pop{border:2px solid var(--brand);box-shadow:var(--shadow)}
.plan-tag{position:absolute;top:-11px;right:14px}
.plan h3{font-size:19px}
.plan-price b{font:600 26px var(--f-display);font-variant-numeric:tabular-nums}
.plan-list{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14px;flex:1}

.imgbox .pph-big.zoom{max-width:none;width:auto;cursor:zoom-out}
.cd-boxes{grid-template-columns:repeat(2,minmax(0,170px))}
/* ===== v12 ===== */
.sh-head{flex-direction:column;align-items:stretch;gap:12px}
.sh-id{display:flex;align-items:center;gap:10px;min-width:0}
.sh-id .grow{min-width:0}
.sh-head .sf-actions{width:100%;gap:8px}
.sh-head .sf-actions .btn{flex:1;justify-content:center;min-height:42px}
.sh-head .sf-actions .iconbtn{flex:none;width:46px;height:42px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px}
.sh-head.has-cover .sf-actions .iconbtn{background:rgba(255,255,255,.9);color:#0e2441;border-color:transparent}
.sh-head.center{flex-wrap:nowrap;text-align:center}
.sh-head.center .sh-id{flex-direction:column;justify-content:center;text-align:center}
.sh-head.center .grow{flex:none;order:0}
.sh-head.center .sf-logo,.sh-head.center .avatar{order:0}
.sh-head.center .sf-actions{order:0}
@container sfh (min-width:720px){
  .sf-desktop .sh-head .sf-actions{width:auto;align-self:flex-end}
  .sf-desktop .sh-head .sf-actions .btn{flex:none;padding-inline:18px}
  .sf-desktop .sh-head.center .sf-actions{align-self:center}
}
/* webcam button: desktop only (phones/tablets use the capture input) */
.webcam-btn{display:none}
@media (pointer:fine) and (min-width:860px){.webcam-btn{display:inline-flex}}
.wc-view{position:relative;background:#0b1220;border-radius:14px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.wc-view video{width:100%;height:100%;object-fit:contain;background:#0b1220}
.wc-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.wc-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.wc-flash.on{animation:wcf .35s ease-out}
@keyframes wcf{from{opacity:.85}to{opacity:0}}
.wc-err{border:1px dashed var(--bad);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.wc-err p{margin:0}
/* pictures: coupon / carrier / staff */
.pic-row{display:flex;align-items:center;gap:12px}
.pic-prev{width:84px;height:84px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;color:var(--muted)}
.pic-prev img{width:100%;height:100%;object-fit:cover}
.pic-prev .stk{display:block}

.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:2px}
.stk-b{display:flex;align-items:center;justify-content:center;padding:3px;border:2px solid transparent;border-radius:12px;background:var(--surface-2);cursor:pointer}
.stk-b[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft)}
.stk-b:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.cp-pic{border-radius:10px;object-fit:cover;flex:none;display:inline-block;vertical-align:middle}
.cp-pic.stk-w{display:inline-flex;border-radius:0}
.chip .cp-pic{margin-left:-6px}
.car-img{border-radius:10px;object-fit:contain;flex:none;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.car-img.ph{background:var(--surface-2);color:var(--muted)}
.zlogo{display:block;flex:none;border-radius:26%}

.qrbox{display:flex;justify-content:center;padding:6px 0}.qrbox .qr{width:224px;height:224px;border-radius:12px;border:1px solid var(--line,#e5e7eb)}.qrbox.off{opacity:.25;filter:grayscale(1)}.paywait svg{animation:paypulse 1.4s ease-in-out infinite}@keyframes paypulse{50%{opacity:.35}}

#pwa-chip{position:fixed;left:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;background:var(--brand);color:#fff;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);overflow:hidden}
#pwa-chip button{background:none;border:0;color:inherit;font:600 14px inherit;cursor:pointer;display:flex;align-items:center;gap:6px;padding:10px 6px 10px 14px}
#pwa-chip .pwa-x{padding:10px 12px 10px 4px;font-size:18px;line-height:1;opacity:.8}
@media print{#pwa-chip{display:none}}

function addGoogleFont(name) {
  name = String(name || '').trim().replace(/\s+/g, ' ');
  if (!/^[A-Za-z0-9 ]{2,40}$/.test(name)) return toast(t('th.fontBad'));
  const fs = S.cd.theme.fonts;
  if (fs.length >= 8) return toast(t('th.fontMax'));
  if (fs.some(f => f.name.toLowerCase() === name.toLowerCase())) return toast(t('th.fontDup'));
  addFontEntry({ id: 'g' + Date.now().toString(36), kind: 'google', name });
}
function addFontFile(file) {
  const fs = S.cd.theme.fonts;
  if (fs.length >= 8) return toast(t('th.fontMax'));
  if (file.size > 1500000) return toast(t('th.fontBig'));
  const fr = new FileReader();
  fr.onload = () => {
    const id = 'f' + Date.now().toString(36), f = { id, kind: 'file', name: file.name.replace(/\.[^.]+$/, '').slice(0, 40) || 'Font', data: fr.result };
    try { new FontFace(fontFam(f), 'url(' + f.data + ')').load().then(x => { document.fonts.add(x); FONT_REG.add(id); addFontEntry(f); }).catch(() => toast(t('th.fontBad'))); } catch (e) { toast(t('th.fontBad')); }
  };
  fr.readAsDataURL(file);
}

function resizeSquare(file, size, cb) {
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const m = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
      x.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, size, size);
      cb(c.toDataURL('image/jpeg', 0.85));
    };
    im.onerror = () => toast(t('prof.bad'));
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- search / filter / paging helpers ---------- */
function matchQ(o, q) {
  q = String(q || '').trim().toLowerCase(); if (!q) return true;
  const dq = digits(q);
  return (dq.length >= 2 && digits(o.cust.phone).includes(dq)) || String(o.cust.name).toLowerCase().includes(q) || o.id.toLowerCase().includes(q);
}
const inRange = (o, r) => !r || r === 'all' || o.t >= (r === 'today' ? new Date().setHours(0, 0, 0, 0) : Date.now() - (+r) * 864e5);
function filterOrders(list, f) {

}
function pager(total, page, act) {
  const pages = Math.ceil(total / PAGE); if (pages <= 1) return '<div class="xs muted pg-info">' + t('pg.of', { a: total ? 1 : 0, b: total, n: total }) + '</div>';
  const from = (page - 1) * PAGE + 1, to = Math.min(total, page * PAGE), nums = [];
  for (let i = 1; i <= pages; i++) if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
  const btn = (n, label, dis, cur) => '<button class="pgb" data-act="' + act + '" data-p="' + n + '"' + (dis ? ' disabled' : '') + (cur ? ' aria-current="page"' : '') + '>' + label + '</button>';
  let h = '', prev = 0;
  nums.forEach(n => { if (prev && n - prev > 1) h += '<span class="pg-gap">…</span>'; h += btn(n, n, false, n === page); prev = n; });
  return '<nav class="pager" aria-label="' + esc(t('pg.nav')) + '"><span class="xs muted pg-info">' + t('pg.of', { a: from, b: to, n: total }) + '</span><div class="pg-btns">' + btn(page - 1, '‹ ' + t('pg.prev'), page <= 1) + h + btn(page + 1, t('pg.next') + ' ›', page >= pages) + '</div></nav>';
}

/* ---------- option groups builder (colour / pattern / type ...) ---------- */
const OG_SUG = ['ob.s.color', 'ob.s.pattern', 'ob.s.type', 'ob.s.size', 'ob.s.material'];
function combosOf(opts) {
  const g = (opts || []).map(o => ({ n: String(o.n || '').trim(), v: [...new Set(String(o.v || '').split(/[,，、]/).map(x => x.trim()).filter(Boolean))] })).filter(o => o.v.length);
  if (!g.length) return { list: [], total: 0 };
  let out = [[]]; g.forEach(o => { const nx = []; out.forEach(c => o.v.forEach(v => nx.push(c.concat([{ n: o.n, v }])))); out = nx; });
  return { list: out.slice(0, MAX_COMBO).map(c => ({ label: c.map(x => x.v).join(' / '), opts: c })), total: out.length };
}
function ogRows(opts) {
  return opts.map((o, i) => '<div class="og-row"><input type="text" name="oname" list="og-sug" maxlength="20" value="' + esc(o.n) + '" placeholder="' + esc(t('ob.namePh')) + '" aria-label="' + esc(t('ob.name')) + '"><input type="text" name="oval" value="' + esc(o.v) + '" placeholder="' + esc(t('ob.valPh')) + '" aria-label="' + esc(t('ob.vals')) + '">' +

}

}

    if (a === 'payonline') { payStart(d.id, false); return; }
    if (a === 'paynew') { if (S.sheet && S.sheet.id) payStart(S.sheet.id, true); return; }
    if (a === 'mailtest') {
      api('POST', '/api/admin/mailtest', { lang: LANG }).then(r => toast(r.s === 200 ? t('mt.sent', { e: r.j.to }) : t('mt.fail', { e: (r.j && (r.j.detail || r.j.error)) || r.s }))); return;
    }
    if (a === 'delstaff') {
      const id = S.sheet.id; api('POST', '/api/staff/delete', { id }).then(r => { if (r.s !== 200) return toast(emsg(r)); applyPlat(r.j.plat); closeSheet(); render(); toast(t('cf.deleted')); }); return;
    }
    if (a === 'staffactive') {
      const u = userById(d.id); if (!u || u.ownerId !== curUser().id) return;
      api('POST', '/api/staff', { id: u.id, name: u.name, phone: u.phone || '', email: u.email, perms: u.perms || [], status: u.status === 'active' ? 'suspended' : 'active' }).then(r => { if (r.s !== 200) return toast(emsg(r)); applyPlat(r.j.plat); render(); }); return;
    }
    if (PUBLIC && (a === 'chat' || a === 'chatorder')) {
      const had = D.threads[0] && D.threads[0].cunread > 0; _act(a, d, el);
      if (had) { const th = D.threads[0]; api('POST', '/api/public/chat', { shop: PUBSLUG, op: 'read', tid: th.id, phone: th.phone }); }
      return;
    }
    if (PUBLIC && ['mode', 'tab', 'openshop', 'newstore', 'editstore', 'share', 'device', 'opendesign'].includes(a)) return;
    _act(a, d, el);
  };
  attachSlip = function (id, img, name) {
    if (!PUBLIC) return _attachSlip(id, img, name);
    const o = D.orders.find(x => x.id === id); if (!o || o.status !== 'unpaid') return false;
    const mine = (LS.get(kMine()) || []).find(x => x.id === id);
    api('POST', '/api/public/slip', { shop: PUBSLUG, id, phone: mine ? mine.phone : o.cust.phone, img, name }).then(r => {
      if (r.s !== 200) return toast(emsg(r));
      D.orders = D.orders.map(x => x.id === id ? r.j.order : x); render();
    });
    o.slip = { img, name: name || '', t: Date.now() };       // optimistic
    return true;
  };
  attachReqSlip = function (id, img, name) {
    const r0 = PLAT.requests.find(x => x.id === id); if (!r0 || r0.status !== 'pending') return false;
    api('POST', '/api/billing/slip', { id, img, name }).then(r => { if (r.s !== 200) return toast(emsg(r)); applyPlat(r.j.plat); render(); });
    r0.slip = { img, name: name || '', t: Date.now() };
    return true;
  };
  render = function () {
    if (!PUBLIC) return _render();
    document.documentElement.lang = LANG;
    const st = store(S.shop); if (!st) return;
    $('#app').innerHTML = '<div class="pub-top">' + langSeg() + '</div>' + '<div class="sf-host pub-host">' + storefront(st, themeOf(st), { device: window.innerWidth >= 900 ? 'desktop' : 'mobile' }) + '</div><div class="pub-foot">' + t('api.power') + ' · <b>Zelly</b></div>';
    renderSheet();
  };
  window.addEventListener('resize', () => { if (PUBLIC && store(S.shop)) { const w = window.innerWidth >= 900; if (w !== !!document.querySelector('.sf-desktop')) render(); } });

  /* ---------- boot ---------- */
  $('#app').innerHTML = '<div class="boot">' + t('api.loading') + '</div>';
  if (PUBLIC) { pubBoot(); return; }
  (async () => {
    const ok = await loadWorkspace();
    if (!ok) { const r = await api('GET', '/api/boot'); if (r.s === 200) applyPlat(r.j.plat); }
    render();
  })();
})();
